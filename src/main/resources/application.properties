# =============================================================================
# Amazon ElastiCache for Redis – Spring Session configuration (cr-java-0065)
# =============================================================================
# All sensitive / environment-specific values are read from environment
# variables so that no credentials or endpoint addresses are hard-coded.
#
# Set the following environment variables in your AWS deployment environment
# (ECS task definition, Elastic Beanstalk environment, EC2 user-data, etc.):
#
#   REDIS_HOST            – ElastiCache primary endpoint hostname
#   REDIS_PORT            – ElastiCache port (typically 6379)
#   SESSION_TIMEOUT_SECS  – Session TTL in seconds (default 1800 = 30 min)
# =============================================================================

# Redis host – resolved from the REDIS_HOST environment variable at runtime.
# Falls back to "localhost" for local development when the variable is unset.
spring.redis.host=${REDIS_HOST:localhost}

# Redis port – resolved from the REDIS_PORT environment variable at runtime.
spring.redis.port=${REDIS_PORT:6379}

# Spring Session store type – use Redis for distributed session management.
spring.session.store-type=redis

# Session timeout – controls the Redis key TTL for each session.
# Override via SESSION_TIMEOUT_SECS environment variable.
server.servlet.session.timeout=${SESSION_TIMEOUT_SECS:1800}s

# =============================================================================
# HikariCP Connection Pool + Amazon RDS Proxy (cr-java-0073)
# =============================================================================
# All sensitive / environment-specific values are read from environment
# variables so that no credentials or endpoint addresses are hard-coded.
#
# Set the following environment variables in your AWS deployment environment
# (ECS task definition, Elastic Beanstalk environment, EC2 user-data, etc.):
#
#   DB_URL       – JDBC URL pointing to the Amazon RDS Proxy endpoint, e.g.
#                  jdbc:mysql://<rds-proxy-endpoint>:3306/hospital
#   DB_USERNAME  – Database username
#   DB_PASSWORD  – Database password (prefer AWS Secrets Manager rotation)
# =============================================================================

# JDBC URL – resolved from the DB_URL environment variable at runtime.
# Falls back to localhost for local development when the variable is unset.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital}

# Database credentials – resolved from environment variables at runtime.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Use HikariCP as the connection pool implementation.
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HmsHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
